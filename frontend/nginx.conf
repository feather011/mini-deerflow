# ============================================================
# 前端生产 nginx 配置（Phase 23）
#
# 两件事：
# 1. /api/* 同源反代到后端，消除生产 CORS
# 2. 其余路径回落到 index.html，保证 SPA 路由刷新可用
#
# 后端自身也挂在 /api 前缀（ApiSettings.api_prefix="/api"），
# 因此 proxy_pass **不带路径**，原样转发 URI。
# ============================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 后端 API（含 SSE）----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须关缓冲，否则事件会攒在代理里不下发
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # 一轮 Agent run 可能较长；上传也有 10MB 上限
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 20m;
    }

    # ---- 静态资源 ----
    location / {
        # 有就直接给，没有（含 SPA 路由）回落到 index.html
        try_files $uri $uri/ /index.html;
    }

    # 带指纹的构建产物可长缓存；index.html 不能缓存，否则发版后拿旧壳
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
